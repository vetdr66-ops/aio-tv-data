name: Build IPTV data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'cameras/**'
  schedule:
    - cron: "17 */12 * * *"

concurrency:
  group: aio-tv-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/build_data.py

      - name: Preserve camera catalog in Pages output
        run: |
          if [ -d cameras ]; then
            mkdir -p public/cameras
            cp -a cameras/. public/cameras/
          fi
          test -s public/cameras/global-index.json

      - name: Check channel and camera streams in parallel
        run: |
          set +e

          python scripts/check_streams.py &
          CHANNEL_PID=$!

          python scripts/check_cameras.py &
          CAMERA_PID=$!

          wait "$CHANNEL_PID"
          CHANNEL_STATUS=$?

          wait "$CAMERA_PID"
          CAMERA_STATUS=$?

          if [ "$CHANNEL_STATUS" -ne 0 ] || [ "$CAMERA_STATUS" -ne 0 ]; then
            echo "One or more stream health checks failed."
            exit 1
          fi

      - name: Refresh admin and static sections from latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: latest-main
          persist-credentials: false

      - name: Preserve latest admin and radio files
        run: |
          for section in admin-shell admin radio; do
            if [ -d "latest-main/public/$section" ]; then
              mkdir -p "public/$section"
              cp -a "latest-main/public/$section/." "public/$section/"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

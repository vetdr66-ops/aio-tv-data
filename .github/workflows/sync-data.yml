name: Build IPTV data

on:
  workflow_dispatch:
    inputs:
      restore_camera_backup:
        description: "Restore the verified camera catalog from the November 6 backup"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  schedule:
    - cron: "17 */12 * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified camera backup
        if: ${{ inputs.restore_camera_backup || contains(github.event.head_commit.message, '[restore-camera-catalog]') }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13523825923
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42257465927
          path: restore

      - name: Restore and commit camera catalog
        if: ${{ inputs.restore_camera_backup || contains(github.event.head_commit.message, '[restore-camera-catalog]') }}
        run: |
          test -f restore/artifact.tar
          tar -xf restore/artifact.tar ./cameras
          test -s cameras/global-index.json
          python -c "import json; d=json.load(open('cameras/global-index.json', encoding='utf-8')); assert d.get('total_cameras') == 6903, d.get('total_cameras')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cameras
          if [ -f .restore-camera-catalog ]; then
            rm .restore-camera-catalog
            git add -A .restore-camera-catalog
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Restore verified live camera catalog"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/build_data.py

      - name: Preserve camera catalog in Pages output
        run: |
          if [ -d cameras ]; then
            mkdir -p public/cameras
            cp -a cameras/. public/cameras/
          fi
          test -s public/cameras/global-index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

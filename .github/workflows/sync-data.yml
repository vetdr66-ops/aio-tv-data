name: Build IPTV data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/build_data.py
\n      - name: Check a small sample of stream URLs\n        run: python scripts/check_streams.py\n
      - name: Preserve camera catalog in Pages output
        run: |
          if [ -d cameras ]; then
            mkdir -p public/cameras
            cp -a cameras/. public/cameras/
          fi
          test -s public/cameras/global-index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
